<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wireframe — Explore</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #fff; color: #333; }
  .label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
  .screen-title { background: #eee; padding: 6px 12px; font-size: 11px; color: #666; border-bottom: 1px solid #ccc; }
  .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; border: 2px solid #333; background: #ddd; }
  .nav-brand { width: 60px; height: 20px; background: #bbb; border: 1px solid #999; }
  .nav-links { display: flex; gap: 12px; }
  .nav-link { width: 50px; height: 16px; background: #bbb; border: 1px solid #999; }
  .annotation { font-size: 10px; color: #e74c3c; margin-top: 4px; font-style: italic; }
  .container { max-width: 800px; margin: 0 auto; padding: 24px; }
  .page-title { width: 200px; height: 22px; background: #ccc; border: 1px solid #aaa; margin-bottom: 20px; }
  .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .search-row { display: flex; gap: 8px; }
  .search-input { flex: 1; height: 36px; background: #fff; border: 2px solid #888; border-radius: 4px; }
  .search-btn { width: 80px; height: 36px; background: #888; border: 1px solid #666; border-radius: 4px; }
  .filter-row { display: flex; gap: 12px; }
  .filter-select { flex: 1; height: 36px; background: #f5f5f5; border: 2px solid #bbb; border-radius: 4px; }
  .card { border: 2px solid #bbb; border-radius: 6px; padding: 16px; margin-bottom: 12px; background: #f9f9f9; }
  .card-meta { display: flex; gap: 8px; margin-bottom: 8px; }
  .tag { width: 60px; height: 12px; background: #ccc; border: 1px solid #aaa; border-radius: 10px; }
  .card-title { width: 320px; height: 16px; background: #bbb; border: 1px solid #999; margin-bottom: 8px; }
  .card-summary { width: 100%; height: 12px; background: #ddd; border: 1px solid #ccc; margin-bottom: 6px; }
  .card-summary.short { width: 70%; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .badge { width: 60px; height: 18px; background: #ccc; border: 1px solid #aaa; border-radius: 10px; }
  .view-btn { width: 120px; height: 28px; background: #888; border: 1px solid #666; border-radius: 4px; }
</style>
</head>
<body>
<div class="screen-title">WIREFRAME — EXPLORE PAGE &nbsp;|&nbsp; Route: /explore</div>
<div class="navbar">
  <div class="nav-brand"></div>
  <div class="nav-links">
    <div class="nav-link"></div>
    <div class="nav-link"></div>
    <div class="nav-link"></div>
  </div>
</div>
<div class="container">
  <div class="page-title"></div>
  <div class="controls">
    <div class="search-row">
      <div class="search-input"></div>
      <div class="search-btn"></div>
    </div>
    <div class="annotation">Live search — filters on keystroke via GET /api/information/?search=</div>
    <div class="filter-row">
      <div class="filter-select"></div>
      <div class="filter-select"></div>
    </div>
    <div class="annotation">Category + Destination dropdowns — fetched from /api/categories/ and /api/destinations/</div>
  </div>

  <div class="card">
    <div class="card-meta"><div class="tag"></div><div class="tag"></div></div>
    <div class="card-title"></div>
    <div class="card-summary"></div>
    <div class="card-summary short"></div>
    <div class="card-footer"><div class="badge"></div><div class="view-btn"></div></div>
  </div>
  <div class="card">
    <div class="card-meta"><div class="tag"></div><div class="tag"></div></div>
    <div class="card-title"></div>
    <div class="card-summary"></div>
    <div class="card-summary short"></div>
    <div class="card-footer"><div class="badge"></div><div class="view-btn"></div></div>
  </div>
  <div class="card">
    <div class="card-meta"><div class="tag"></div><div class="tag"></div></div>
    <div class="card-title"></div>
    <div class="card-summary"></div>
    <div class="card-summary short"></div>
    <div class="card-footer"><div class="badge"></div><div class="view-btn"></div></div>
  </div>
</div>
</body>
</html>
