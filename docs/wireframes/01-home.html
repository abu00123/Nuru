<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wireframe — Home</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #fff; color: #333; }
  .label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
  .screen-title { background: #eee; padding: 6px 12px; font-size: 11px; color: #666; border-bottom: 1px solid #ccc; }

  /* navbar */
  .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; border: 2px solid #333; background: #ddd; }
  .nav-brand { width: 60px; height: 20px; background: #bbb; border: 1px solid #999; }
  .nav-links { display: flex; gap: 12px; }
  .nav-link { width: 50px; height: 16px; background: #bbb; border: 1px solid #999; }
  .nav-link.admin { width: 60px; border: 2px solid #999; }

  /* hero */
  .hero { background: #ccc; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; border: 2px solid #999; }
  .hero-h1 { width: 400px; height: 28px; background: #aaa; border: 1px solid #888; }
  .hero-sub { width: 300px; height: 14px; background: #bbb; border: 1px solid #999; }
  .search-bar { display: flex; gap: 8px; }
  .search-input { width: 280px; height: 36px; background: #fff; border: 2px solid #888; border-radius: 4px; }
  .search-btn { width: 80px; height: 36px; background: #888; border: 1px solid #666; border-radius: 4px; }

  /* section */
  .section { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
  .section-title { width: 180px; height: 18px; background: #ccc; border: 1px solid #aaa; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .category-card { border: 2px solid #bbb; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: #f5f5f5; }
  .cat-icon { width: 32px; height: 32px; background: #ccc; border-radius: 50%; border: 1px solid #aaa; }
  .cat-name { width: 60px; height: 12px; background: #bbb; border: 1px solid #aaa; }

  /* footer */
  .footer { border-top: 2px solid #ccc; padding: 16px 24px; background: #eee; display: flex; justify-content: center; }
  .footer-text { width: 200px; height: 12px; background: #ccc; border: 1px solid #aaa; }

  /* annotations */
  .annotation { font-size: 10px; color: #e74c3c; margin-top: 4px; font-style: italic; }
</style>
</head>
<body>
<div class="screen-title">WIREFRAME — HOME PAGE &nbsp;|&nbsp; Route: /</div>

<div class="navbar">
  <div class="nav-brand"></div>
  <div class="nav-links">
    <div class="nav-link"></div>
    <div class="nav-link"></div>
    <div class="nav-link admin"></div>
  </div>
</div>

<div class="hero">
  <div class="label">Hero Section</div>
  <div class="hero-h1"></div>
  <div class="hero-sub"></div>
  <div class="search-bar">
    <div class="search-input"></div>
    <div class="search-btn"></div>
  </div>
  <div class="annotation">Search navigates to /explore?search=query</div>
</div>

<div class="section">
  <div class="section-title"></div>
  <div class="annotation" style="margin-bottom:12px;">Categories fetched from GET /api/categories/</div>
  <div class="grid">
    <div class="category-card"><div class="cat-icon"></div><div class="cat-name"></div></div>
    <div class="category-card"><div class="cat-icon"></div><div class="cat-name"></div></div>
    <div class="category-card"><div class="cat-icon"></div><div class="cat-name"></div></div>
    <div class="category-card"><div class="cat-icon"></div><div class="cat-name"></div></div>
    <div class="category-card"><div class="cat-icon"></div><div class="cat-name"></div></div>
    <div class="category-card"><div class="cat-icon"></div><div class="cat-name"></div></div>
    <div class="category-card"><div class="cat-icon"></div><div class="cat-name"></div></div>
    <div class="category-card"><div class="cat-icon"></div><div class="cat-name"></div></div>
  </div>
</div>

<div class="footer"><div class="footer-text"></div></div>
</body>
</html>
