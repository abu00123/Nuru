<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mockup — Report Form</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f8faf9; color: #1e293b; }
  .screen-title { background: #1a3c2e; color: #cde8d8; padding: 6px 12px; font-size: 11px; letter-spacing: 1px; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #1a3c2e; }
  .brand { color: #fff; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; }
  .nav-links { display: flex; gap: 1.5rem; align-items: center; }
  .nav-link { color: #cde8d8; font-size: 0.95rem; text-decoration: none; }
  .admin-link { color: #4caf82; border: 1px solid #4caf82; padding: 0.3rem 0.8rem; border-radius: 4px; font-size: 0.9rem; }
  .container { max-width: 560px; margin: 0 auto; padding: 2rem 1.5rem; }
  .back { color: #1a3c2e; font-size: 0.9rem; text-decoration: none; display: inline-block; margin-bottom: 1.5rem; }
  h1 { font-size: 1.4rem; font-weight: 700; color: #1e293b; margin-bottom: 1.5rem; }
  .form-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
  label { font-weight: 600; font-size: 0.9rem; color: #374151; display: block; margin-bottom: 0.4rem; }
  select, textarea { width: 100%; padding: 0.7rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; font-family: inherit; }
  textarea { resize: vertical; height: 100px; }
  .submit-btn { padding: 0.75rem; background: #1a3c2e; color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; }
  footer { background: #1a3c2e; color: #cde8d8; text-align: center; padding: 1.5rem; font-size: 0.85rem; margin-top: 2rem; }
</style>
</head>
<body>
<div class="screen-title">MOCKUP — REPORT FORM &nbsp;|&nbsp; Route: /report/:id</div>
<nav>
  <span class="brand">NURU</span>
  <div class="nav-links">
    <a class="nav-link" href="#">Home</a>
    <a class="nav-link" href="#">Explore</a>
    <a class="admin-link" href="#">Admin</a>
  </div>
</nav>
<div class="container">
  <a class="back" href="#">← Back</a>
  <h1>Report Information</h1>
  <div class="form-card">
    <div>
      <label>Why are you reporting this?</label>
      <select>
        <option>Information appears outdated</option>
        <option>Information is incorrect</option>
        <option>Information is incomplete</option>
        <option>Other</option>
      </select>
    </div>
    <div>
      <label>Comments (optional)</label>
      <textarea placeholder="Provide additional details..."></textarea>
    </div>
    <button class="submit-btn">Submit Report</button>
  </div>
</div>
<footer>© 2024 Nuru — Digital Return Information Management System</footer>
</body>
</html>
