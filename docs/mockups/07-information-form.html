<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mockup — Add Information</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f8faf9; color: #1e293b; }
  .screen-title { background: #1a3c2e; color: #cde8d8; padding: 6px 12px; font-size: 11px; letter-spacing: 1px; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #1a3c2e; }
  .brand { color: #fff; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; }
  .nav-links { display: flex; gap: 1.5rem; align-items: center; }
  .nav-link { color: #cde8d8; font-size: 0.95rem; text-decoration: none; }
  .admin-link { color: #4caf82; border: 1px solid #4caf82; padding: 0.3rem 0.8rem; border-radius: 4px; font-size: 0.9rem; }
  .logout-btn { background: transparent; border: 1px solid #94a3b8; color: #94a3b8; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
  .container { max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem; }
  h1 { font-size: 1.4rem; font-weight: 700; color: #1a3c2e; margin-bottom: 1.5rem; }
  .form-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
  .field { display: flex; flex-direction: column; gap: 0.4rem; }
  label { font-weight: 600; font-size: 0.9rem; color: #374151; }
  input, select, textarea { padding: 0.7rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; font-family: inherit; width: 100%; }
  textarea { resize: vertical; height: 110px; }
  .two-col { display: flex; gap: 1rem; }
  .two-col .field { flex: 1; }
  .check-row { display: flex; align-items: center; gap: 0.5rem; }
  .check-row input { width: auto; }
  .check-row label { font-weight: 600; font-size: 0.9rem; color: #374151; cursor: pointer; }
  .submit-btn { padding: 0.75rem; background: #1a3c2e; color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; }
  footer { background: #1a3c2e; color: #cde8d8; text-align: center; padding: 1.5rem; font-size: 0.85rem; margin-top: 2rem; }
</style>
</head>
<body>
<div class="screen-title">MOCKUP — ADD INFORMATION &nbsp;|&nbsp; Route: /admin/new</div>
<nav>
  <span class="brand">NURU</span>
  <div class="nav-links">
    <a class="nav-link" href="#">Home</a>
    <a class="nav-link" href="#">Explore</a>
    <a class="admin-link" href="#">Admin</a>
    <button class="logout-btn">Logout</button>
  </div>
</nav>
<div class="container">
  <h1>Add Information</h1>
  <div class="form-card">
    <div class="field"><label>Title</label><input type="text" value="Primary Schools Reopened in Kirundo Province" /></div>
    <div class="field"><label>Summary</label><input type="text" value="Primary schools in Kirundo Province have resumed normal operations. Enrollment is open for returning children." /></div>
    <div class="field"><label>Content</label><textarea>As of early 2024, all 14 public primary schools in Kirundo Province have reopened. Returning families can enroll children by presenting a birth certificate at the local school office. No fees are required for primary enrollment.</textarea></div>
    <div class="field"><label>Source Name</label><input type="text" value="UNICEF Burundi" /></div>
    <div class="field"><label>Source Url</label><input type="text" value="https://www.unicef.org/burundi" /></div>
    <div class="two-col">
      <div class="field">
        <label>Category</label>
        <select><option>Education</option><option>Safety</option><option>Healthcare</option></select>
      </div>
      <div class="field">
        <label>Destination</label>
        <select><option>Kirundo</option><option>Bujumbura</option><option>Gitega</option></select>
      </div>
    </div>
    <div class="two-col">
      <div class="field">
        <label>Verification Status</label>
        <select><option>Verified</option><option>Unverified</option><option>Outdated</option></select>
      </div>
      <div class="field">
        <label>Last Verified</label>
        <input type="date" value="2024-03-15" />
      </div>
    </div>
    <div class="check-row">
      <input type="checkbox" id="publish" checked />
      <label for="publish">Publish</label>
    </div>
    <button class="submit-btn">Publish</button>
  </div>
</div>
<footer>© 2024 Nuru — Digital Return Information Management System</footer>
</body>
</html>
